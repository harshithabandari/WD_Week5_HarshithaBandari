<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple to-do list for planning and tracking everyday tasks.">
  <title>Dayframe | To-do list</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#main" aria-label="Dayframe home">
      <span class="brand-mark" aria-hidden="true">D</span>
      <span>dayframe</span>
    </a>
    <p class="topbar-note">A little progress, every day.</p>
  </header>

  <main id="main" class="workspace">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">YOUR PERSONAL TASK LIST</p>
      <h1 id="page-title">Make room for<br><span>what matters.</span></h1>
      <p class="today" id="today-date"></p>
    </section>

    <section class="task-panel" aria-label="To-do list">
      <div class="progress-row">
        <div>
          <p class="section-label">TODAY'S PLAN</p>
          <h2>Your tasks</h2>
        </div>
        <p class="progress-count" id="progress-count" aria-live="polite">0 of 0 done</p>
      </div>

      <form id="task-form" class="task-form">
        <label class="visually-hidden" for="task-input">New task</label>
        <input id="task-input" name="task" type="text" maxlength="100" placeholder="What needs doing?" required>
        <label class="visually-hidden" for="priority-input">Task priority</label>
        <select id="priority-input" name="priority" aria-label="Task priority">
          <option value="low">Low priority</option>
          <option value="medium" selected>Medium priority</option>
          <option value="high">High priority</option>
        </select>
        <button class="add-button" type="submit"><span aria-hidden="true">+</span> Add task</button>
      </form>
      <p id="form-message" class="form-message" role="status"></p>

      <div class="list-tools">
        <div class="filter-tabs" role="group" aria-label="Filter tasks">
          <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <span class="visually-hidden">Search tasks</span>
          <input id="search-input" type="search" placeholder="Search tasks">
        </label>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <div id="empty-state" class="empty-state">
        <span class="empty-mark" aria-hidden="true">✳</span>
        <p class="empty-title">A fresh page.</p>
        <p class="empty-copy">Add a task above and get started.</p>
      </div>

      <div class="list-footer">
        <p id="task-summary">No tasks yet</p>
        <button id="clear-completed" class="clear-button" type="button" hidden>Clear completed</button>
      </div>
    </section>

    <footer class="page-footer">
      <span>ONE THING AT A TIME</span>
      <span>DAYFRAME </span>
    </footer>
  </main>
</body>
</html>
